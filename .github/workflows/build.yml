name: "Build"

on:
  pull_request:
  push:

jobs:
  macos:
    # running on macos since we cannot crossbuild from
    # other hosts for macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/magic-nix-cache-action@v11
      - run: nix develop --command make crossbuild
      - run: nix develop --command make crossbuild_mac
      - name: 'Upload Artifacts'
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/*
          retention-days: 5
